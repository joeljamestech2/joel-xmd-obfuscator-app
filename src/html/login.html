<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Protection Suite</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="terminal-card login-box">
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: #8b5cf6; margin: 0;">System Login</h2>
        <p style="font-size: 12px; color: #8b949e;">else login using logins</p>
      </div>

      <form id="loginForm">
        <label style="font-size: 12px; display:block; margin-bottom: 5px;">Email / Username</label>
        <input type="text" id="username" class="input-field" placeholder="Enter username..." required>

        <label style="font-size: 12px; display:block; margin-bottom: 5px;">Passcode / Password</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••" required>

        <button type="submit" class="action-btn" style="margin-top: 10px;">Login Now</button>
      </form>
      
      <div style="text-align: center; margin-top: 15px; font-size: 11px; color: #8b949e;">
        joeljamestech inc 2026
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        window.location.href = '/admin';
      } else {
        alert('Authentication mismatch. Please try again.');
      }
    });
  </script>
</body>
</html>
